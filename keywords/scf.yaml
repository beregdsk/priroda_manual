group: scf
order: 50
summary:
  en: Spin restriction, convergence, iteration limits and SCF solver.
keywords:
  - name: restrict
    type: switch
    default: null
    default_note:
      en: "`1` for a closed-shell singlet, otherwise `0`. Version 25 ran O2 with `mult=3` (an even number of electrons) unrestricted without being told."
    values:
      - {value: "0", en: Spin-unrestricted.}
      - {value: "1", en: Spin-restricted (available only for a few methods).}
    description:
      en: Spin restriction.
    see_also: [guess.mix]
    status: current
    sources: ["input.txt", "08 t48"]
    verified_against: "25 (2025.02.28)"
  - name: convergence
    type: list
    default: [1e-6, 1e-3]
    default_note:
      en: the first value is for SCF and the second for CP-SCF.
    description:
      en: |
        SCF and CP-SCF convergence thresholds. The SCF value is a threshold on the energy gradient: in version
        25, an SCF whose gradient stayed near 2·10⁻⁶ ended with `no convergence!` at the default 1e-6. The defaults
        are recommended. To save time in difficult cases you may
        loosen the SCF value to `1e-5` for preliminary geometry optimizations.
    notes:
      en: |
        **Put `iterations=` before `convergence=`, or give `convergence` two values.** A one-value `convergence=`
        followed by `iterations=` stops the run with `*** error in '$scf' : unknown name terations`, also when the
        two keywords are on separate lines. The message names the next keyword with its first letters missing; how
        many depends on the value: version 25 printed `terations` after `1e-7` and `erations` after `1e-10`.
        `iterations=250 convergence=1e-7` and `convergence=1e-7,1e-3 iterations=250` both work. Check the
        `scf: conv = …; iter=…` echo line in the output.
    see_also: [scf.iterations, scf.procedure]
    status: current
    sources: ["input.txt", "01 §4.5 (output echo, energy gradient)", "05 §5.1", "04 #322-#324", "08 t01, t07a, t07b", "08 t22a-c", "08 t74b (gradient vs threshold)", "08 Slurm (erations)"]
    verified_against: "25 (2025.02.28)"
  - name: iterations
    type: list
    default: [32, 16]
    description:
      en: Maximum number of iterations and of microiterations (`iterations=it,micro`).
    default_note:
      en: |
        Version 25 echoes `iter=32,16` for DFT. v6, v13 and v15 echoed `16,16`, a HF run for CCSD showed `48,16`, and
        `Dft.rtf` gives 30 (older version). The default may depend on the method and version.
    notes:
      en: |
        **An unconverged SCF does not stop the run.** Version 25 prints `no convergence!`, then still prints `E =`,
        the orbitals and the properties, and exits with status 0. Search the output for `no convergence!`.

        Raising the limit moderately is fine: an OH radical failed at the default 32 iterations and converged after
        34 with `iterations=100`. A very large limit does not replace understanding why the SCF is not converging
        (`Dft.rtf` warns against it). A recommended technique for difficult cases is to cap the run at
        `iterations=10`, save the vectors (`$control save=`) and restart with `$guess read=1`, repeating as needed.
    see_also: [scf.convergence, guess.read]
    status: current
    sources: ["input.txt", "01 §4.5", "04 #319", "05 §5", "Dft.rtf", "02 §3.2 (pri help)", "04 #306", "08 t01, t10, t28, t71b"]
    verified_against: "25 (2025.02.28)"
  - name: procedure
    type: enum
    default: nr
    default_note:
      en: "`nr` for GGA DFT."
    values:
      - {value: nr, en: Newton–Raphson quadratically convergent. Can recover even from a wrong starting electronic configuration but may blow up in hard cases., default: true}
      - {value: bfgs, en: BFGS Hessian update. Less prone to blowing up but usually slower and sometimes converges poorly.}
    description:
      en: Algorithm for solving the SCF equations. If one procedure fails, try the other.
    example: |
      $scf convergence=1e-7 procedure=bfgs iterations=250 $end
      $grid accuracy=1e-9 $end
    status: current
    sources: ["input.txt", "Dft.rtf", "04 #320", "08 t07b"]
    verified_against: "25 (2025.02.28)"
  - name: d1small
    type: switch
    default: 0
    values:
      - {value: "1", en: "Include the small-component density in the linear equations of quadratically convergent SCF (scalar-relativistic pure DFT)."}
      - {value: "0", en: "Discard these contributions. This is faster, but SCF may fail to converge for molecules containing the heaviest atoms.", default: true}
    description:
      en: Small-component density in quadratically convergent SCF.
    see_also: [control.four]
    status: current
    sources: ["input.txt"]
    verified_against: null
  - name: core
    type: integer
    default: null
    default_note:
      en: "computed from the atom table; see `$atoms core`."
    description:
      en: Number of core electrons for HF-based methods.
    see_also: [atoms.core]
    status: current
    sources: ["input.txt"]
    verified_against: null
