group: Energy
order: 140
summary:
  en: Results of an earlier run (energy, gradient, Hessian, dipole data), read back as input.
body:
  en: |
    The program prints this group on lines prefixed with `eng>` (an energy/gradient/Hessian run), or `num>` (the
    pieces of a distributed numerical Hessian; see `$d2edr2 steps`). Strip the prefix and append the group to the
    next input. The shipped helper script `ge` does this.

    A stored Hessian is required for `$optimize saddle=1` and `task=irc`. It also speeds up difficult minimizations,
    and it lets you redo vibrational analysis or thermochemistry (for example for other isotopes, `$thermo mass=`)
    without recomputing.

    ```text
    eng>$Energy
    eng> E=-2.284057276940e+03
    eng> D= 4.22290114e-08 -1.82061636e-08  2.32661117e-08
    eng> G= 5.13271929e-06 -5.52234429e-06 -6.15997899e-06
    eng>    ...
    eng>$end
    ```
keywords:
  - name: E
    type: real
    default: null
    units: hartree
    description:
      en: Total energy.
    status: undocumented
    sources: ["01 §4.10", "02 §3.2"]
    verified_against: null
  - name: G
    type: list
    default: null
    units: au
    description:
      en: Cartesian gradient (3N values).
    status: undocumented
    sources: ["01 §4.10", "02 §3.2"]
    verified_against: null
  - name: H
    type: list
    default: null
    units: au
    description:
      en: |
        Hessian as a lower triangle, 3N(3N+1)/2 values. Written by `task=hessian` on `eng>` lines; in version 25 a
        `saddle=1` optimization and an IRC read it back from an appended `$Energy` group. If the input holds several
        `$Energy` groups, the last one is used.
    see_also: [optimize.saddle]
    status: undocumented
    sources: ["02 §3.2", "08 t24, t25, t41, t41b"]
    verified_against: "25 (2025.02.28)"
  - name: D
    type: list
    default: null
    units: au
    description:
      en: Dipole moment.
    status: undocumented
    sources: ["01 §4.10", "02 §3.2 (inferred)"]
    verified_against: null
  - name: Dx
    type: list
    default: null
    description:
      en: "Dipole derivatives with respect to nuclear coordinates (inferred from use: IR/Raman intensities)."
    status: undocumented
    sources: ["02 §3.2 (inferred)"]
    verified_against: null
  - name: A
    type: list
    default: null
    description:
      en: "Polarizability, and its derivatives after `task=dipole` (inferred; used for Raman intensities)."
    status: undocumented
    sources: ["02 §3.2 (inferred)", "04 #381"]
    verified_against: null
