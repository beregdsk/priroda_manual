group: atoms
order: 90
summary:
  en: Per-element core definitions for correlated (HF-based) methods.
keywords:
  - name: core
    type: indexed-array
    default: null
    description:
      en: |
        For HF-based methods, the number of core shells for L=0,1,2,3, given for each atomic number. The values are
        used only to compute the total number of core electrons in the molecule.
    example: |
      $atoms core(280)=2,1,0,0 $end
      # 1s, 2s, 2p (10 electrons) of nickel are core
    notes:
      en: |
        The index is 10·Z: `core(280)` is nickel, `core(80)` oxygen. In version 25, `core(80)=0,0,0,0` removed the
        oxygen 1s from the frozen core of an RI-MP2 run. The output reports the frozen core as `atom   8 core =  1`
        and `Number of core electrons 1`; the number there apparently counts core orbitals, not electrons (the C60
        example output also prints `Number of core  electrons 60` for 60 carbon atoms).
    see_also: [scf.core, atoms.mcore]
    status: current
    sources: ["input.txt", "08 t16", "01 §7"]
    verified_against: "25 (2025.02.28)"
  - name: mcore
    type: integer
    default: null
    description:
      en: |
        A simple way to add outer-core shells to the correlation treatment. `input.txt` says: "mcore=M means to add all
        shells with principal quantum number M less than that of the outermost valence shell", i.e. the shells with
        n = n(valence) − M. Whether shells between those and the valence shell are also added is not stated.
    see_also: [atoms.core]
    status: current
    sources: ["input.txt"]
    verified_against: null
